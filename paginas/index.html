<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>PixelCore - Tecnología a tu medida</title>
</head>
<body>
    <header>
        <img id = "logo"src="../imagenes/logo-pixelCore.png" alt="Logo de PixelCore">
        <div class = "logo-info">
            <img id = "nombre-logo" src="../imagenes/nombre-pixelCore.png" alt="Nombre de PixelCore">
            <p id="descripcion-logo">Tecnología a tu medida</p>
        </div>
        <nav class = "navbar">
            <ul>
                <li>INICIO</li>
                <li>TIENDA</li>
                <li>SERVICIOS</li>
                <li>ARMA TU PC</li>
                <li>NOSOTROS</li>
                <li>CONTACTO</li>
                <li>CARRITO DE COMPRAS</li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="banner">
            <img src="../imagenes/banner_laptop.png" alt="banner de laptops">
        </section>
        <section class="productos">
            <figure class= "productos-card" id= "laptops">
                <img class = "img-card" src="../imagenes/card-laptop.png" alt="Laptops">
                <figcaption class = "text-card">
                    <h2>LAPTOPS</h2>
                    <p>Ligeras. Potentes. Preparadas para todo.</p>
                    <p>Encuentra laptops para estudiar, trabajar, crear y jugar.</p>
                </figcaption>
            </figure>
            <figure class= "productos-card" id= "pcs">
                <figcaption class = "text-card">
                    <h2>PC'S DE ESCRITORIO</h2>
                    <p>Máximo rendimiento. Mínimas limitaciones.</p>
                    <p>Equipos diseñados para quienes exigen más de su computadora.</p>
                </figcaption>
                <img class = "img-card" src="../imagenes/card-pc.png" alt="PC's">
            </figure>
            <figure class= "productos-card" id= "componentes">
                <img class = "img-card" src="../imagenes/card-componentes.png" alt="componentes de PC">
                <figcaption class = "text-card">
                    <h2>COMPONENTES DE PC</h2>
                    <p>El poder está en cada pieza.</p>
                    <p>Descubre hardware de última generación para llevar tu PC al siguiente nivel.</p>
                </figcaption>
            </figure>
            <figure class= "productos-card" id= "perifericos">
                <figcaption class = "text-card">
                    <h2>PERIFÉRICOS</h2>
                    <p>Mejora tu experiencia de usuario.</p>
                    <p>Descubre los mejores accesorios para complementar tu setup.</p>
                </figcaption>
                <img class = "img-card" src="../imagenes/card-perifericos.png" alt="Periféricos de PC">
            </figure>
        </section>
        <hr>
        <section class = "armado-pc">
            <p>¿No sabes por dónde empezar?</p>
            <h2>ARMA TU PC CON NOSOTROS</h2>
            <figure class = "armado-pc-card">
                <iframe 
                    width="1080" height="480"
                    src="https://www.youtube-nocookie.com/embed/bmqyrYRSf_Q?si=VLhyrjJyoLAX0cys" 
                    title="YouTube video player" 
                    frameborder="1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                </iframe>
                <figcaption>Diseñamos una PC a la medida de tus necesidades y presupuesto.<br> Ya sea para gaming, diseño, programación, edición de video o trabajo profesional, te ayudamos a seleccionar cada componente para obtener el mejor rendimiento posible.</figcaption>
            </figure>
        </section>
        <section class = "servicios">
            <h2>NUESTROS SERVICIOS</h2>
            <div id = "contenedor-servicios-card">
                <figure class = "servicios-card">
                    <img class = "img-card" src="../imagenes/card-servicios-mantenimiento.jpg" alt="Mantenimiento de PC">
                    <figcaption class = "text-card">
                        <h3>MANTENIMIENTO DE EQUIPOS</h3>
                        <p>Ofrecemos servicios de mantenimiento preventivo y correctivo para garantizar el óptimo funcionamiento de tus equipos.</p>
                    </figcaption>
                </figure>
                <figure class = "servicios-card">
                    <img class = "img-card" src="../imagenes/card-servicios-instalacion.webp" alt="Instalación de software">
                    <figcaption class = "text-card">
                        <h3>INSTALACIÓN DE SOFTWARE</h3>
                        <p>Instalamos software y configuramos tu sistema para que esté listo para usar.</p>
                    </figcaption>
                </figure>
                <figure class = "servicios-card">
                    <img class = "img-card" src="../imagenes/card-servicios-reparacion.jpg" alt="Reparación de equipos">
                    <figcaption class = "text-card">
                        <h3>DIAGNÓSTICO Y REPARACIÓN</h3>
                        <p>Realizamos diagnósticos precisos y reparaciones para resolver cualquier problema técnico en tus equipos.</p>
                    </figcaption>
                </figure>
            </div>
        </section>
        <section class = "testimonios">
            <h2>Testimonios</h2>
            <p>De nuestros clientes</p>
            <div id = "contenedor-testimonios-card">
                <figure class="testimonio-card">
                    <img class = "img-card" src="../imagenes/persona-1.jpg" alt="Foto del cliente">
                    <figcaption class="text-card">
                        <h4 class="nombre">María Gómez</h4>
                        <p class="cargo">CEO de TechSolutions</p>
                        <div class="estrellas">★★★★★</div>
                        <p class="texto-testimonio">"El servicio fue excepcional, superaron todas nuestras expectativas y el equipo de soporte siempre estuvo disponible cuando lo necesitamos. Totalmente recomendados."</p>
                    </figcaption>
                </figure>
                <figure class="testimonio-card">
                    <img class = "img-card" src="../imagenes/persona-2.jpg" alt="Foto del cliente">
                    <figcaption class="text-card">
                        <h4 class="nombre">Juan Giménez</h4>
                        <p class="cargo">Supervisor de ventas de NetSecurity</p>
                        <div class="estrellas">★★★★★</div>
                        <p class="texto-testimonio">"Atención rápida, trato amable y equipos con garantía."</p>
                    </figcaption>
                </figure>
                <figure class="testimonio-card">
                    <img class = "img-card" src="../imagenes/persona-3.jpg" alt="Foto del cliente">
                    <figcaption class="text-card">
                        <h4 class="nombre">Roberto Sánchez</h4>
                        <p class="cargo">Desarrollador de software</p>
                        <div class="estrellas">★★★★★</div>
                        <p class="texto-testimonio">"Cuentan con equipos de última tecnología y sus servicios son muy completos. Altamente recomendado."</p>
                    </figcaption>
                </figure>
                <figure class="testimonio-card">
                    <img class = "img-card" src="../imagenes/persona-4.jpg" alt="Foto del cliente">
                    <figcaption class="text-card">
                        <h4 class="nombre">Manuel Suárez</h4>
                        <p class="cargo">Gamer profesional</p>
                        <div class="estrellas">★★★★★</div>
                        <p class="texto-testimonio">"Su servicio de Armado de PC's es muy completo. Cuentan con los últimos componentes y a buen precio."</p>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
