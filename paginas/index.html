<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <title>PixelCore - Tecnología a tu medida</title>
</head>
<body>
    <header>
        <img id = "logo"src="../imagenes/logo-pixelCore.png" alt="Logo de PixelCore">
        <div class = "logo-info">
            <img id = "nombre-logo" src="../imagenes/nombre-pixelCore.png" alt="Nombre de PixelCore">
            <p id="descripcion-logo">Tecnología a tu medida</p>
        </div>
        <nav class = "navbar">
            <ul>
                <li>INICIO</li>
                <li>TIENDA</li>
                <li>SERVICIOS</li>
                <li>ARMA TU PC</li>
                <li>NOSOTROS</li>
                <li>CONTACTO</li>
                <li>CARRITO DE COMPRAS</li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="banner">
            <img src="../imagenes/banner_laptop.png" alt="banner de laptops">
        </section>
        <section class="productos">
            <figure class= "productos-card" id= "laptops">
                <img class = "img-card" src="../imagenes/card-laptop.png" alt="Laptops">
                <figcaption class = "text-card">
                    <h2>LAPTOPS</h2>
                    <p>Ligeras. Potentes. Preparadas para todo.</p>
                    <p>Encuentra laptops para estudiar, trabajar, crear y jugar.</p>
                </figcaption>
            </figure>
            <figure class= "productos-card" id= "pcs">
                <figcaption class = "text-card">
                    <h2>PC'S DE ESCRITORIO</h2>
                    <p>Máximo rendimiento. Mínimas limitaciones.</p>
                    <p>Equipos diseñados para quienes exigen más de su computadora.</p>
                </figcaption>
                <img class = "img-card" src="../imagenes/card-pc.png" alt="PC's">
            </figure>
            <figure class= "productos-card" id= "componentes">
                <img class = "img-card" src="../imagenes/card-componentes.png" alt="componentes de PC">
                <figcaption class = "text-card">
                    <h2>COMPONENTES DE PC</h2>
                    <p>El poder está en cada pieza.</p>
                    <p>Descubre hardware de última generación para llevar tu PC al siguiente nivel.</p>
                </figcaption>
            </figure>
            <figure class= "productos-card" id= "perifericos">
                <figcaption class = "text-card">
                    <h2>PERIFÉRICOS</h2>
                    <p>Mejora tu experiencia de usuario.</p>
                    <p>Descubre los mejores accesorios para complementar tu setup.</p>
                </figcaption>
                <img class = "img-card" src="../imagenes/card-perifericos.png" alt="Periféricos de PC">
            </figure>
        </section>
        <hr>
        <section class = "armado-pc">
            <p>¿No sabes por dónde empezar?</p>
            <h2>ARMA TU PC CON NOSOTROS</h2>
            <figure class = "armado-pc-card">
                <iframe 
                    width="1080" height="480"
                    src="https://www.youtube-nocookie.com/embed/bmqyrYRSf_Q?si=VLhyrjJyoLAX0cys" 
                    title="YouTube video player" 
                    frameborder="1" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
                </iframe>
                <figcaption>Diseñamos una PC a la medida de tus necesidades y presupuesto.<br> Ya sea para gaming, diseño, programación, edición de video o trabajo profesional, te ayudamos a seleccionar cada componente para obtener el mejor rendimiento posible.</figcaption>
            </figure>
        </section>
    </main>
    <footer></footer>
</body>
</html>
